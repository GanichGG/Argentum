plugins {
	id 'java'
}

// Встроенный клиентский мод ArgentumLoader: всё, что должно жить ВНУТРИ Minecraft
// (экраны, надписи на экране загрузки, UI релоадера).
//
// Без Loom: он тяжёлый, а нашему коду нужен лишь компилятор и сигнатуры. Поэтому задача prepareMinecraft сама скачивает
// клиент нужной версии и его библиотеки с серверов Mojang, ремапит клиент в intermediary (tiny-remapper, карта —
// net.fabricmc:intermediary) — в тех же именах, что и рантайм, так что рефмап не нужен — и кладёт всё в кэш Gradle
// (~/.gradle/argentum-minecraft/<версия>), чтобы собирать можно было на любой машине, в том числе в CI.
// Код пишется в intermediary-именах (Yarn — в комментариях).
// Отдельная независимая сборка (свой settings.gradle) — корневой проект её не включает.

// Версия мода выводится из ArgentumVersion.DISPLAY корневого проекта (формат 0.1B1): в манифесте SemVer-запись, в имени файла — для людей.
def argentumSource = file("${rootDir}/../src/main/java/net/fabricmc/loader/impl/ArgentumVersion.java").text
def argentumDisplay = (argentumSource =~ /DISPLAY\s*=\s*"(.*)";/)[0][1]
def argentumParts = (argentumDisplay =~ /^(\d+)\.(\d+)(?:([AB])(\d+))?$/)

if (!argentumParts.matches()) {
	throw new GradleException("ArgentumVersion.DISPLAY must look like 0.1, 0.1A3 or 0.1B1, got: ${argentumDisplay}")
}

def argentumSemver = "${argentumParts.group(1)}.${argentumParts.group(2)}.0" + (argentumParts.group(3) ? "-${argentumParts.group(3).toLowerCase()}.${argentumParts.group(4)}" : "")
version = "${argentumSemver}+mc${project.minecraft_version}"

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

configurations {
	remapper
}

dependencies {
	remapper 'net.fabricmc:tiny-remapper:0.14.1'
	compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
}

def mcCache = new File(gradle.gradleUserHomeDir, "argentum-minecraft/${project.minecraft_version}")
def clientJar = new File(mcCache, 'client.jar')
def intermediaryJar = new File(mcCache, "client-intermediary-${project.loader_version}.jar")
def libsDir = new File(mcCache, 'libraries')

tasks.register('prepareMinecraft') {
	description = 'Downloads Minecraft and its libraries and remaps the client to intermediary names (cached).'
	outputs.file(intermediaryJar)

	def remapperClasspath = configurations.remapper
	def minecraftVersion = project.minecraft_version

	doLast {
		def download = { String url, File target ->
			if (target.exists() && target.length() > 0) {
				return
			}

			target.parentFile.mkdirs()
			def tmp = new File(target.parentFile, target.name + '.part')

			for (int attempt = 1; ; attempt++) {
				try {
					new URL(url).withInputStream { input -> tmp.withOutputStream { out -> out << input } }
					tmp.renameTo(target)
					break
				} catch (IOException e) {
					if (attempt >= 3) {
						throw new GradleException("Could not download ${url}: ${e}")
					}
				}
			}
		}

		def slurper = new groovy.json.JsonSlurper()
		def manifest = slurper.parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
		def entry = manifest.versions.find { it.id == minecraftVersion }

		if (entry == null) {
			throw new GradleException("Minecraft ${minecraftVersion} is not in the Mojang version manifest")
		}

		def meta = slurper.parse(new URL(entry.url))
		download(meta.downloads.client.url as String, clientJar)

		meta.libraries.each { lib ->
			def artifact = lib.downloads?.artifact

			if (artifact != null && !artifact.path.contains('natives')) {
				download(artifact.url as String, new File(libsDir, (artifact.path as String).replace('/', '_')))
			}
		}

		def mappingsJar = new File(mcCache, "intermediary-${minecraftVersion}-v2.jar")
		download("https://maven.fabricmc.net/net/fabricmc/intermediary/${minecraftVersion}/intermediary-${minecraftVersion}-v2.jar", mappingsJar)
		def tiny = new File(mcCache, 'mappings.tiny')

		new java.util.zip.ZipFile(mappingsJar).withCloseable { zip ->
			tiny.withOutputStream { out -> out << zip.getInputStream(zip.getEntry('mappings/mappings.tiny')) }
		}

		// tiny-remapper пишет jar, только если имя оканчивается на .jar (иначе создаёт папку)
		def tmpJar = new File(mcCache, 'client-intermediary.tmp.jar')
		tmpJar.delete()

		def command = [new File(System.getProperty('java.home'), 'bin/java').absolutePath, '-cp',
				remapperClasspath.files.collect { it.absolutePath }.join(File.pathSeparator), 'net.fabricmc.tinyremapper.Main',
				clientJar.absolutePath, tmpJar.absolutePath, tiny.absolutePath, 'official', 'intermediary']
		command.addAll(libsDir.listFiles().findAll { it.name.endsWith('.jar') }.collect { it.absolutePath })

		def process = new ProcessBuilder(command).redirectErrorStream(true).start()
		def output = process.inputStream.text

		if (process.waitFor() != 0) {
			throw new GradleException("tiny-remapper failed:\n${output}")
		}

		tmpJar.renameTo(intermediaryJar)
	}
}

// классы самого лоадера — экран каталога вызывает движок Modrinth (impl.modrinth); собираются корневым проектом
def loaderClasses = findProperty('loader_classes') ?: "${rootDir}/../build/classes/java/main"

dependencies {
	compileOnly files(intermediaryJar) {
		builtBy 'prepareMinecraft'
	}
	// библиотеки игры (lwjgl, brigadier, authlib, fastutil, joml...) — типы из них торчат в сигнатурах классов Minecraft
	compileOnly fileTree(libsDir) {
		include '*.jar'
		builtBy 'prepareMinecraft'
	}
	compileOnly files(loaderClasses)
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'argentumloader_min', argentumSemver

	filesMatching('fabric.mod.json') {
		expand 'version': project.version, 'argentumloader_min': argentumSemver
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

jar {
	archiveBaseName = 'argentum-client'
	archiveVersion = "${argentumDisplay}+mc${project.minecraft_version}"
}
