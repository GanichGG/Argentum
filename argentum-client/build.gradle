plugins {
	id 'java'
}

// Встроенный клиентский мод ArgentumLoader: всё, что должно жить ВНУТРИ Minecraft
// (экраны, надписи на экране загрузки, UI релоадера).
//
// Без Loom: он требует скачивать и ремапить Minecraft с серверов Mojang (у нас это не завершается),
// а нашему коду нужен лишь компилятор и сигнатуры. Поэтому компилируем напрямую против jar,
// который Prism/лоадер уже сделали при первом запуске игры, — он сразу в intermediary-именах, в тех же,
// что и рантайм, так что рефмап не нужен. Код пишется в intermediary-именах (Yarn — в комментариях).
// Отдельная независимая сборка (свой settings.gradle) — корневой проект её не включает.

version = project.mod_version

def prismRoot = findProperty('prism_root') ?: "${System.getenv('APPDATA')}/PrismLauncher"
def intermediaryJar = findProperty('intermediary_jar') ?:
		"${prismRoot}/instances/1.21.1/minecraft/.fabric/remappedJars/minecraft-1.21.1-${project.loader_version}/client-intermediary.jar"
def mixinJar = findProperty('mixin_jar') ?:
		"${prismRoot}/libraries/net/fabricmc/sponge-mixin/0.17.4+mixin.0.8.7/sponge-mixin-0.17.4+mixin.0.8.7.jar"

dependencies {
	compileOnly files(intermediaryJar, mixinJar)
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

jar {
	archiveBaseName = 'argentum-client'
}
