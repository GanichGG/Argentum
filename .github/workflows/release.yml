name: Release

# A release is cut by pushing a tag "v" + the version from ArgentumVersion.DISPLAY, for example v0.1B1.
# Versions with a stage letter (A = alpha, B = beta) are published as pre-releases, a plain x.y is a stable release.
# Before tagging: add a section [0.1B1] to CHANGELOG.md - the release notes are taken from it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/argentum-minecraft
          key: argentum-minecraft-${{ hashFiles('argentum-client/gradle.properties') }}

      - id: meta
        run: |
          tag="${GITHUB_REF_NAME}"                   # v0.1B1
          ver="${tag#v}"                             # 0.1B1
          declared=$(grep -oP 'DISPLAY = "\K[^"]+' src/main/java/net/fabricmc/loader/impl/ArgentumVersion.java)
          if [ "$ver" != "$declared" ]; then
            echo "::error::Tag $tag does not match ArgentumVersion.DISPLAY ($declared)"
            exit 1
          fi
          base=$(grep -oP 'VERSION = "\K[^"]+' src/main/java/net/fabricmc/loader/impl/FabricLoaderImpl.java)
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "loaderjar=fabric-loader-${base}+argentum.${ver}.jar" >> "$GITHUB_OUTPUT"
          if [[ "$ver" =~ [AB][0-9]+$ ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - run: python tools/check_translations.py
      - name: Loader
        run: ./gradlew -PargentumRelease=1 :checkstyleMain :checkstyleTest :minecraft:checkstyleMain :test :finalJar --stacktrace
      - name: Client mod
        working-directory: argentum-client
        run: ../gradlew build --stacktrace

      - name: Collect
        run: |
          mkdir dist
          cp "build/libs/${{ steps.meta.outputs.loaderjar }}" "dist/argentum-loader-${{ steps.meta.outputs.version }}.jar"
          cp argentum-client/build/libs/argentum-client-*.jar dist/
          python tools/release_notes.py "${{ steps.meta.outputs.version }}" > dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist-jars
          path: dist/
          if-no-files-found: error

  installer:
    # Native Windows installer (GraalVM native-image). If it fails, the release still goes out with the jars.
    runs-on: windows-2022
    needs: jars
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/argentum-minecraft
          key: argentum-minecraft-${{ hashFiles('argentum-client/gradle.properties') }}
      - name: Tools for the icon and subsystem steps
        shell: bash
        run: python -m pip install pywin32
      - name: Installer
        shell: bash
        run: ./gradlew -PargentumRelease=1 :installer:nativeCompile --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dist-installer
          path: installer/build/native/nativeCompile/ArgentumAnchor.exe
          if-no-files-found: warn

  release:
    runs-on: ubuntu-24.04
    needs: [jars, installer]
    if: always() && needs.jars.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum $(ls | grep -v NOTES.md) > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ArgentumLoader ${{ needs.jars.outputs.version }}
          prerelease: ${{ needs.jars.outputs.prerelease == 'true' }}   # alpha/beta versions are pre-releases
          body_path: dist/NOTES.md
          files: |
            dist/*.jar
            dist/*.exe
            dist/SHA256SUMS.txt
