name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/argentum-minecraft
          key: argentum-minecraft-${{ hashFiles('argentum-client/gradle.properties') }}

      - name: Translations are complete
        run: python tools/check_translations.py

      - name: Loader - checkstyle, tests, jar
        run: ./gradlew :checkstyleMain :checkstyleTest :minecraft:checkstyleMain :test :finalJar --stacktrace

      - name: Client mod
        working-directory: argentum-client
        run: ../gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/fabric-loader-*+local.jar
            argentum-client/build/libs/argentum-client-*.jar
          if-no-files-found: error
